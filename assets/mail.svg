  <!-- 邮件标题 -->
  <text x="100" y="178" font-size="26" font-weight="700" fill="#1A73E8">📢 江苏师范大学每日通知推送（2026年11月04日）</text>
  <text x="100" y="214" font-size="16" fill="#4B5563">🆕 今日新增 <tspan font-weight="700" fill="#D73A49">3</tspan> 条相关通知：</text>

