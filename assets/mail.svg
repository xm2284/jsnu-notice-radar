    <rect x="100" y="268" width="4" height="74" fill="#1A73E8"/>
    <text x="120" y="296" font-size="16" font-weight="600" fill="#1F2937">[2026-11-04] 关于组织参加 2026 年全国大学生数学建模竞赛报名的通知</text>
