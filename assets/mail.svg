<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
  <rect width="1200" height="560" fill="#EDF1F7"/>

  <!-- 邮件客户端外框 -->
  <rect x="60" y="40" width="1080" height="480" rx="14" fill="#FFFFFF" stroke="#DDE4EF"/>

  <!-- 窗口标题条 -->
  <rect x="60" y="40" width="1080" height="46" rx="14" fill="#F4F6FA"/>
  <rect x="60" y="72" width="1080" height="14" fill="#F4F6FA"/>
  <circle cx="88" cy="63" r="6" fill="#E5E9F2"/>
  <circle cx="108" cy="63" r="6" fill="#E5E9F2"/>
