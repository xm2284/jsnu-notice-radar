  </g>

  <!-- 通知卡片 2 -->
  <g>
    <rect x="100" y="352" width="1000" height="74" rx="6" fill="#F6F8FA"/>
    <rect x="100" y="352" width="4" height="74" fill="#1A73E8"/>
    <text x="120" y="380" font-size="16" font-weight="600" fill="#1F2937">[2026-11-03] 关于开展 2026-2027 学年第一学期期末考试安排的通知</text>
